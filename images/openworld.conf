# openworld-provision config (/etc/openworld.conf). All values optional;
# anything already set in the environment/kernel command line wins over this file.

# Datasource: auto (cidata, then imds) | cidata | imds | none
#OPENWORLD_CLOUD=auto

# Metadata service base URL for the imds datasource (default 169.254.169.254;
# the IPv6 link-local [fd00:ec2::254] is also tried as a fallback).
#OPENWORLD_IMDS=http://169.254.169.254

# Default account to configure (used when no OPENWORLD_USER is given).
#OPENWORLD_USER=root

# Grow the root filesystem to fill the disk on first boot (best effort,
# needs resize2fs/blockdev in the image).
#OPENWORLD_RESIZE=1